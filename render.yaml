# Render Blueprint: deploys the Desire Discovery Assessment as a web service.
# In Render: New + -> Blueprint -> select this repo and branch -> Apply.
#
# Email on Render: the FREE tier blocks all outbound SMTP ports (25/465/587),
# so this app ships with Resend support, which delivers over HTTPS (port 443)
# and works on the free tier. Create a free Resend account
# (https://resend.com), make an API key, and set RESEND_API_KEY on the
# dashboard. To email participants (not just yourself), verify a domain in
# Resend and set RESEND_FROM to an address on it -- the default
# onboarding@resend.dev sender only delivers to the Resend account owner.
# SMTP remains available as a fallback on paid instances.
#
# Storage: the filesystem is ephemeral (free tier cannot attach disks), so
# ./submissions/ backups do not survive restarts. Once email works, set
# ADMIN_EMAIL to receive the durable full copy of each submission.
#
# Branch: deploys are pinned to the feature branch below. After merging,
# change `branch:` to your long-lived branch (or remove it for the default).
services:
  - type: web
    name: desire-discovery-assessment
    runtime: node
    plan: free
    branch: claude/kink-preference-quiz-6uoz8c
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: TRUST_PROXY
        value: "1"
      # Recommended on Render: HTTPS email that works on the free tier.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      # Durable full copy of each submission once email works.
      - key: ADMIN_EMAIL
        sync: false
      # SMTP fallback (paid instances only; free tier blocks SMTP ports).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
